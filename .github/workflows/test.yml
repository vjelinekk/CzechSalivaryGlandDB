name: Build

on: [pull_request]

jobs:
    prettier_eslint:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository code
              uses: actions/checkout@v4
            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: npm install
            - run: npm run eslint
            - run: npm run prettier
            - run: npm run test
