name: Release and Publish

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            tag_name: ${{ steps.tag.outputs.name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Extract tag name
              id: tag
              run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Check that release notes exist
              run: |
                  FILE="release_notes/${{ steps.tag.outputs.name }}.md"
                  if [ ! -f "$FILE" ]; then
                    echo "❌ Release notes not found: $FILE"
                    exit 1
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.name }}
                  name: Version ${{ steps.tag.outputs.name }}
                  body_path: release_notes/${{ steps.tag.outputs.name }}.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish_windows:
        needs: release
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.14'

            - name: Build ML Engine (Windows)
              shell: bash
              run: |
                  cd python-ml-engine
                  pip install -r requirements.txt
                  pip install pyinstaller
                  ./build.sh
                  cd ..
                  mkdir ml_engine
                  mv python-ml-engine/dist/ml_engine.exe ml_engine/

            - run: npm install

            - run: npm run publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
